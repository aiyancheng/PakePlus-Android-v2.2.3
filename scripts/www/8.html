<body>

                        <p class="text-gray-600">采用先进的离焦技术，有效延缓近视发展，保护孩子视力健康</p>
                    </div>

                        </div>

    <script>
        // 动态生成套餐卡片
        function renderPackages() {
            const container = document.getElementById('packages-container');
            
            packages.forEach((pkg, index) => {
                const card = document.createElement('div');
                card.className = `package-card shadow-lg p-8 card-${index + 1} fade-in`;
                card.style.animationDelay = `${index * 0.1}s`;
                
                card.innerHTML = `
                    <div class="text-center mb-6">
                        <span class="inline-block bg-indigo-100 text-indigo-800 text-sm font-semibold px-3 py-1 rounded-full mb-4">
                            套餐 ${index + 1}
                        </span>
                        <div class="price-tag text-indigo-600 mb-2">${pkg.price}</div>
                        <div class="text-gray-600 text-sm">性价比之选</div>
                    </div>
                    
                    <div class="space-y-4">
                        <div class="flex items-center p-3 bg-gray-50 rounded-lg">
                            <i class="fas fa-eye mr-3 text-indigo-600"></i>
                            <div>
                                <div class="font-semibold text-gray-800">镜片配置</div>
                                <div class="text-sm text-gray-600">${pkg.lens}</div>
                            </div>
                        </div>
                        
                        <div class="flex items-center p-3 bg-gray-50 rounded-lg">
                            <i class="fas fa-shopping-bag mr-3 text-green-600"></i>
                            <div>
                                <div class="font-semibold text-gray-800">镜架配置</div>
                                <div class="text-sm text-gray-600">${pkg.frame}</div>
                            </div>
                        </div>
                        
                        <div class="mt-6">
                            <div class="font-semibold text-gray-800 mb-3 flex items-center">
                                <i class="fas fa-star mr-2 text-yellow-500"></i>
                                镜片特点
                            </div>
                            <div class="space-y-2">
                                ${pkg.features.map(feature => `
                                    <div class="feature-item">
                                        <i class="fas fa-check-circle feature-icon"></i>
                                        <span class="text-sm text-gray-700">${feature}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
                
                container.appendChild(card);
            });
        }

        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', function() {
            // 渲染套餐卡片
            renderPackages();
        });
    </script>
